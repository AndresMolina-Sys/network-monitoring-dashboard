name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build Storybook
        run: npm run build-storybook

      - name: Build frontend
        run: npm run build

      - name: Build API
        run: dotnet build backend/NetworkMonitoring.Api/NetworkMonitoring.Api.csproj --configuration Release

      - name: Test API
        run: dotnet test backend/NetworkMonitoring.Api.Tests/NetworkMonitoring.Api.Tests.csproj --configuration Release

      - name: Run full-stack smoke tests
        run: npm run test:e2e:full-stack

      - name: Build backend container
        run: docker build --tag network-monitoring-api:ci ./backend/NetworkMonitoring.Api
